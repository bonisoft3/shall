services:
  ollama:
    image: shall-ollama-with-qwen25-coder-7b:latest
    build:
      context: .
      dockerfile: ollama.Dockerfile
    environment:
      # Inference cases can outlast Ollama's default five-minute eviction window.
      OLLAMA_KEEP_ALIVE: "-1"
    healthcheck:
      # HTTP probes flood compose's attached logs through Ollama's request logger.
      test: ["CMD-SHELL", "pgrep -x ollama >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  integrate:
    build:
      context: .
      dockerfile_inline: |
        # Pin Nushell with its libc to avoid ABI mismatches from separate installs.
        FROM bonitao/lazybox@sha256:d94263b75982a5592ac66d36d2d24aa96cd01a4fea55053a36c7baeffdc18f66
        WORKDIR /app
        COPY shall.nu shall.test.nu ./
        ENV OLLAMA_URL=http://ollama:11434
        CMD ["nu", "shall.test.nu", "--url", "http://ollama:11434"]
    depends_on:
      ollama:
        condition: service_healthy
